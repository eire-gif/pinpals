</pattern>
<filter id="pp-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1"/></filter>
<filter id="pp-shadow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="2.2"/></filter>
