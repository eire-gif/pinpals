# Publish an over-the-air app update — the same as running
#   cd mobile && eas update --branch production --platform ios -m "…"
# in a Codespace, without needing one. GitHub Actions minutes are free on a
# public repo, so this keeps working when Codespaces' monthly allowance runs out.
#
# Run it: GitHub → Actions → "Publish app update" → Run workflow → type what
# changed → Run. It always publishes what's on main.
#
# One-time setup: an Expo access token saved as the repo secret EXPO_TOKEN
# (expo.dev → Account settings → Access tokens; GitHub → Settings → Secrets
# and variables → Actions → New repository secret).
#
# Only for JavaScript changes. A new native module needs a new build, not an
# update — eas update refuses to ship to phones whose runtime doesn't match.

name: Publish app update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "What changed (shown in the EAS dashboard)"
        required: true
        type: string
      platform:
        description: "Which phones"
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - ios and android

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add your Expo access token as the repository secret EXPO_TOKEN first (see the top of this file)."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install
        run: |
          npm ci
          cd mobile && npm ci

      # Never ship a broken app to members' phones.
      - name: Typecheck the app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: App tests
        run: npx vitest run --project mobile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish to iPhone
        if: inputs.platform != 'android'
        working-directory: mobile
        run: eas update --branch production --platform ios --message "$MESSAGE" --non-interactive
        env:
          MESSAGE: ${{ inputs.message }}

      - name: Publish to Android
        if: inputs.platform != 'ios'
        working-directory: mobile
        run: eas update --branch production --platform android --message "$MESSAGE" --non-interactive
        env:
          MESSAGE: ${{ inputs.message }}
